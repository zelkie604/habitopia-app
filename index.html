<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10152F">
<title>Habitopia – Small Steps. Legendary Grades.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- shared SVG gradients (flame, badges, aura) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC85A"/><stop offset=".55" stop-color="#FF8A3D"/><stop offset="1" stop-color="#E5481A"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC85A"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <linearGradient id="g-common" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55D6A0"/><stop offset="1" stop-color="#1D7A5C"/></linearGradient>
    <linearGradient id="g-rare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FB0FF"/><stop offset="1" stop-color="#2E56A8"/></linearGradient>
    <linearGradient id="g-epic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B79CFF"/><stop offset="1" stop-color="#5B34C4"/></linearGradient>
    <linearGradient id="g-legendary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset=".5" stop-color="#FFC85A"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <linearGradient id="g-locked" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4d77"/><stop offset="1" stop-color="#2c2f55"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#FFC85A" stop-opacity=".55"/><stop offset="1" stop-color="#FFC85A" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<div class="app" id="app">
  <div class="stars"></div>
  <span class="fly" style="left:12%;top:30%"></span><span class="fly" style="left:80%;top:22%;animation-delay:2s"></span>
  <span class="fly" style="left:60%;top:70%;animation-delay:4s"></span><span class="fly" style="left:25%;top:80%;animation-delay:1s"></span>

  <main class="screen" id="screen" aria-live="polite"></main>
  <button class="fab" id="fab" data-act="create" hidden>＋ Create Quest</button>
  <nav class="nav" id="nav" aria-label="Main navigation"></nav>

  <div id="fxL" aria-hidden="true"></div>
  <div id="toastL"></div>
  <div id="ovL"></div>
  <div id="onbL"></div>
  <div id="splash" role="status"><div id="splashFox"></div><h1 class="disp" style="font-size:34px">Habitopia</h1><p>Sharpening your pencils…</p><div class="loadbar"><i></i></div></div>
</div>

<script src="script.js"></script>
</body>
</html>
